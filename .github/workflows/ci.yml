name: CI

# Single source of truth for CI. The `plan` job holds ALL gating logic
# (change detection + module dependency fan-in + event/ref rules) and emits
# plain outputs; every other job is a simple `if: needs.plan.outputs.X`.
#
# Module dependency graph (drives the fan-in in `plan`):
#   toolkit  -> (depended on by dialect, backend, app)
#   dialect  -> (depended on by backend, app)
#   backend  -> (hosted server; nothing depends on it)
#   app      -> desktop client
#
# Branch protection should require the single "CI OK" check (not the individual
# matrix legs), since path-gated jobs may legitimately be skipped.

on:
  push:
    branches: [dev, main]
    tags: ['v[0-9]*']
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly full scan (Monday 06:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR; never cancel dev/main/tag builds.
#
# The branch is baked into the group rather than into cancel-in-progress. An
# expression there evaluates to the *string* "false" for a push, which is
# non-empty and so still cancels: 11 of the last 27 dev pushes were cancelled
# under the previous form, including cfd6c3c, whose cancelled run is how a
# stale generated file reached dev unchecked (see #176).
#
# Giving every non-PR run its own group (run_id is unique per run) means a push
# to dev/main/a tag shares a group with nothing and can never be superseded,
# while PR runs still collapse onto one group per ref.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v3.0.0-beta.12
  # Minimum app version, bump when a release contains a breaking change.
  MIN_APP_VERSION: 0.0.0

jobs:
  plan:
    name: Plan CI
    runs-on: ubuntu-latest
    outputs:
      go-app:          ${{ steps.plan.outputs.go-app }}
      go-backend:      ${{ steps.plan.outputs.go-backend }}
      go-dialect:      ${{ steps.plan.outputs.go-dialect }}
      frontend:        ${{ steps.plan.outputs.frontend }}
      python:          ${{ steps.plan.outputs.python }}
      web:             ${{ steps.plan.outputs.web }}
      go-modules:      ${{ steps.plan.outputs.go-modules }}
      desktop:         ${{ steps.plan.outputs.desktop }}
      staging-release: ${{ steps.plan.outputs.staging-release }}
      draft-release:   ${{ steps.plan.outputs.draft-release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: plan
        run: |
          EVENT="${{ github.event_name }}"
          REF="${{ github.ref }}"

          # Raw per-area change flags. Full on push/dispatch/schedule; on PRs we
          # diff the merge against its base (HEAD~1 of the merge commit).
          frontend=false; app=false; backend=false; dialect=false; toolkit=false; python=false; web=false
          if [[ "$EVENT" == "push" || "$EVENT" == "workflow_dispatch" || "$EVENT" == "schedule" ]]; then
            frontend=true; app=true; backend=true; dialect=true; toolkit=true; python=true; web=true
          else
            FILES="$(git diff --name-only HEAD~1 HEAD || true)"
            if grep -qE '^(\.github/|\.gitleaks\.toml)' <<<"$FILES"; then
              # Shared infra changed -> run everything to be safe.
              frontend=true; app=true; backend=true; dialect=true; toolkit=true; python=true; web=true
            else
              grep -q '^app/frontend/' <<<"$FILES" && frontend=true || true
              grep -qE '^app/(internal|build)/|^app/(main\.go|Taskfile\.yml|go\.(mod|sum)|\.golangci)' <<<"$FILES" && app=true || true
              grep -q '^backend/' <<<"$FILES" && backend=true || true
              { grep '^dialect/' <<<"$FILES" | grep -qv '^dialect/core/tokenanalyzer/python/'; } && dialect=true || true
              grep -q '^dialect/core/tokenanalyzer/python/' <<<"$FILES" && python=true || true
              grep -q '^toolkit/' <<<"$FILES" && toolkit=true || true
              # The website: its own source, any doc page (they live next to the
              # code they document), the app theme it takes its colours from,
              # and the OpenAPI spec behind the API reference.
              grep -q '^web/' <<<"$FILES" && web=true || true
              grep -q '\.doc\.md$' <<<"$FILES" && web=true || true
              grep -q '^app/internal/graph/defaults/user/\.theme$' <<<"$FILES" && web=true || true
              grep -q '^backend/internal/apigen/gen/openapi\.json$' <<<"$FILES" && web=true || true
            fi
          fi

          # Dependency fan-in: everyone depends on toolkit; backend & app depend on dialect.
          go_dialect=false; [[ "$dialect" == true || "$toolkit" == true ]] && go_dialect=true || true
          go_backend=false; [[ "$backend" == true || "$dialect" == true || "$toolkit" == true ]] && go_backend=true || true
          go_app=false;     [[ "$app" == true || "$dialect" == true || "$toolkit" == true ]] && go_app=true || true
          go_toolkit="$toolkit"

          # JSON array of Go modules that need security scanning (govulncheck + semgrep).
          mods=()
          [[ "$go_app" == true ]] && mods+=('"app"') || true
          [[ "$go_backend" == true ]] && mods+=('"backend"') || true
          [[ "$go_dialect" == true ]] && mods+=('"dialect"') || true
          [[ "$go_toolkit" == true ]] && mods+=('"toolkit"') || true
          joined="$(IFS=,; echo "${mods[*]}")"

          # Build/release gates (kept out of every job's conditional).
          desktop=false
          if [[ "$EVENT" == "workflow_dispatch" ]] || { [[ "$EVENT" == "push" ]] && { [[ "$REF" == "refs/heads/dev" ]] || [[ "$REF" == refs/tags/* ]]; }; }; then
            desktop=true
          fi
          staging=false; [[ "$EVENT" == "push" && "$REF" == "refs/heads/dev" ]] && staging=true || true
          draft=false;   [[ "$EVENT" == "push" && "$REF" == refs/tags/* ]] && draft=true || true

          {
            echo "go-app=$go_app"
            echo "go-backend=$go_backend"
            echo "go-dialect=$go_dialect"
            echo "frontend=$frontend"
            echo "python=$python"
            echo "web=$web"
            echo "go-modules=[${joined}]"
            echo "desktop=$desktop"
            echo "staging-release=$staging"
            echo "draft-release=$draft"
          } >> "$GITHUB_OUTPUT"

          echo "Plan: go-modules=[${joined}] frontend=$frontend python=$python web=$web desktop=$desktop staging=$staging draft=$draft"

  # ---- Security / vulnerability scanning (path-gated matrix) ----
  security:
    name: Security (${{ matrix.module }})
    needs: [plan]
    if: needs.plan.outputs.go-modules != '[]'
    runs-on: ubuntu-latest
    # Guardrail: this step set is fast (semgrep is build-free, govulncheck is one
    # compile). A run that exceeds this is stuck, not working — fail, don't hang.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.go-modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # The app module embeds the frontend build output; stub it so packages compile.
      - run: mkdir -p app/frontend/build && touch app/frontend/build/.keep
      - run: sudo apt-get update && sudo apt-get install -y gcc
      # The app module binds the webview through cgo, so loading its packages
      # needs the GTK3/WebKit2GTK headers the desktop build links against.
      - if: matrix.module == 'app'
        run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        env:
          BUILD_TAGS: ${{ matrix.module == 'app' && 'gtk3' || '' }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ${BUILD_TAGS:+-tags=$BUILD_TAGS} ./...
      - name: semgrep (SAST)
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.module }}
        run: |
          # Build-free SAST — replaces gosec, whose whole-program SSA re-compiled
          # the entire module graph on every cold runner (~6 min + near-OOM on
          # backend, which repeatedly hung/SIGTERM'd this job). Semgrep parses
          # source directly, so it's ~seconds and independent of the build cache.
          # Deep interprocedural taint (SSRF/path-traversal/injection) now runs
          # nightly in the CodeQL workflow (.github/workflows/codeql.yml), off the
          # PR critical path.
          #
          # Blocking gate: --error makes semgrep exit non-zero on any finding, so
          # a new issue fails the PR.
          #
          # Two acceptance mechanisms, by scope:
          #   * Categorical patterns are excluded repo-wide here (documented,
          #     mirrors the old gosec -exclude rationale):
          #       string-formatted-query            engine builds parameterized SQL; values are bound (was gosec G201/G202)
          #       unsafe-deserialization-interface  heterogeneous sync payloads unmarshaled then type-switched, by design
          #       potential-dos-via-decompression-bomb  decompresses only our own signed release artifacts
          #   * Single reviewed sites are suppressed inline with `// nosemgrep`
          #     (keeps the rule active for any new code): the desktop TOFU SSH
          #     host key (dialect/engine/ssh.go) and a reflect-by-name over a
          #     struct's own field names (app/internal/graph/helpers.go).
          pipx run --spec 'semgrep==1.170.0' semgrep scan \
            --config p/gosec --config p/golang \
            --exclude-rule go.lang.security.audit.database.string-formatted-query.string-formatted-query \
            --exclude-rule go.lang.security.deserialization.unsafe-deserialization-interface.go-unsafe-deserialization-interface \
            --exclude-rule go.lang.security.decompression_bomb.potential-dos-via-decompression-bomb \
            --exclude='*_test.go' --error --metrics=off --disable-version-check .

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan working tree for secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose

  # ---- Quality (lint / typecheck) ----
  quality-frontend:
    name: Frontend typecheck & lint
    needs: [plan]
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
        working-directory: app/frontend
      - run: npm run check
        working-directory: app/frontend
      - run: npm run lint
        working-directory: app/frontend

  quality-app-backend:
    name: App backend quality
    needs: [plan]
    if: needs.plan.outputs.go-app == 'true'
    runs-on: ubuntu-latest
    # Wails v3 binds the webview through cgo, so analysing the app module needs
    # the GTK3/WebKit2GTK headers the desktop build links against.
    env:
      GOFLAGS: -tags=gtk3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: mkdir -p app/frontend/build && touch app/frontend/build/.keep
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: app
          # Skip the JSONSchema fetch from golangci-lint.run. It runs before any
          # linting, in each of these three jobs, so an outage there fails a
          # build for reasons unrelated to the code — as it did on #174.
          verify: false
      - name: Dead code check
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          # deadcode sets its own -tags, which overrides the one in GOFLAGS, so
          # the cgo build tag has to be repeated here.
          # deadcode exits 0 even when it finds dead code; treat any output as failure
          out=$(deadcode -tags=gtk3 ./...)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::Dead code detected"
            exit 1
          fi
          echo "No dead code found"
        working-directory: app

  quality-backend:
    name: Backend quality
    needs: [plan]
    if: needs.plan.outputs.go-backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: backend
          # Skip the JSONSchema fetch from golangci-lint.run. It runs before any
          # linting, in each of these three jobs, so an outage there fails a
          # build for reasons unrelated to the code — as it did on #174.
          verify: false
      - name: Dead code check
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          # -test: the e2e harness is reachable only from _test.go files, so tests
          # must be roots or the whole support package reads as dead.
          # deadcode exits 0 even when it finds dead code; treat any output as failure
          out=$(deadcode -test ./...)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::Dead code detected"
            exit 1
          fi
          echo "No dead code found"
        working-directory: backend

  quality-dialect:
    name: Dialect quality
    needs: [plan]
    if: needs.plan.outputs.go-dialect == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dialect/go.mod
          cache-dependency-path: dialect/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: dialect
          # Skip the JSONSchema fetch from golangci-lint.run. It runs before any
          # linting, in each of these three jobs, so an outage there fails a
          # build for reasons unrelated to the code — as it did on #174.
          verify: false

  # ---- Tests ----
  test-app-backend:
    name: App backend tests
    needs: [plan, quality-app-backend]
    if: needs.plan.outputs.go-app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: sudo apt-get update && sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go test -tags gtk3 ./internal/...
        working-directory: app

  test-backend:
    name: Backend tests
    needs: [plan, quality-backend]
    if: needs.plan.outputs.go-backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: embedded-postgres-${{ runner.os }}-
      # The audit e2e tests run against Postgres 18 + pg_partman so they exercise
      # the production audit config (real monthly partitions), not the no-partman
      # DEFAULT-partition fallback. The harness connects via TEST_PG_*; packages
      # without those env vars fall back to embedded Postgres. Postgres 18 lands
      # on a non-5432 port (the runner's preinstalled cluster holds 5432), so the
      # port is derived, not hardcoded.
      - name: Postgres 18 + pg_partman
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-18-partman
          sudo pg_createcluster --start 18 main || sudo pg_ctlcluster 18 main start || true
          PORT=$(pg_lsclusters -h | awk '$1==18 {print $3}')
          sudo -u postgres psql -p "$PORT" -c "ALTER USER postgres PASSWORD 'postgres';"
          {
            echo "TEST_PG_HOST=localhost"
            echo "TEST_PG_PORT=$PORT"
            echo "TEST_PG_USER=postgres"
            echo "TEST_PG_PASSWORD=postgres"
          } >> "$GITHUB_ENV"
      - run: go test ./...
        working-directory: backend

  test-dialect:
    name: Dialect tests
    needs: [plan, quality-dialect]
    if: needs.plan.outputs.go-dialect == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dialect/go.mod
          cache-dependency-path: dialect/go.sum
      - run: go test ./...
        working-directory: dialect

  test-analyzer:
    name: Analyzer tests
    needs: [plan]
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync
        working-directory: dialect/core/tokenanalyzer/python
      - run: uv run --with pytest pytest analysis/ completion/ lint_rules/ -v
        working-directory: dialect/core/tokenanalyzer/python

  e2e-app:
    name: App e2e
    needs: [plan]
    if: needs.plan.outputs.frontend == 'true' || needs.plan.outputs.go-app == 'true'
    runs-on: ubuntu-latest
    # The suite drives a server-mode build (`-tags server`): the real Go
    # services and bindings behind an HTTP server instead of a webview, so it
    # runs under an ordinary browser with no display server in sight.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      # Both the wails CLI and the binding generator compile the app's cgo
      # webview code, so this job needs the GTK3 headers even though the binary
      # it ends up testing links no GUI toolkit at all.
      - run: sudo apt-get update && sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-wails
        with:
          path: ~/go/bin/wails*
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - run: npm ci
        working-directory: app/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: app/frontend

      - run: wails3 task test:e2e
        working-directory: app

      # The bindings are committed, and building the suite regenerates them, so
      # a Go signature change that was never regenerated shows up here as a
      # dirty tree rather than as a type error nobody sees until runtime.
      - name: Generated bindings are up to date
        working-directory: app
        run: |
          git diff --exit-code frontend/src/lib/bindings || {
            echo "::error::Bindings are stale. Run 'wails3 task generate:bindings' and commit the result."
            exit 1
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: app/frontend/playwright-report/
          retention-days: 7

  # ---- Website (docs + API reference + marketing) ----
  website:
    name: Website
    needs: [plan]
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/generate/go.mod
          cache-dependency-path: web/generate/go.sum
      # The Scalar bundle behind /api/ is fetched once and cached; without this
      # every run re-downloads it and a bad day upstream fails the build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.cache
          key: web-cache-${{ hashFiles('web/generate/main.go') }}
          restore-keys: web-cache-
      # The build is the check. It fails on a broken internal link, a sidebar
      # entry pointing at a file that does not exist, a marketing page over the
      # 14 KB brotli budget, or a page fetching from a third-party origin.
      - run: go run .
        working-directory: web/generate

  # ---- Single required gate: aggregates every PR-relevant job ----
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - plan
      - security
      - gitleaks
      - quality-frontend
      - quality-app-backend
      - quality-backend
      - quality-dialect
      - test-app-backend
      - test-backend
      - test-dialect
      - test-analyzer
      - e2e-app
      - website
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::A required job did not pass ($r)"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."

  # ---- Build & release (dev/tags only; gated by plan) ----
  # Staging version: derived from commit count, not GITHUB_RUN_NUMBER, which
  # resets when the workflow file is renamed and would break the update toast.
  version:
    name: Compute staging version
    needs: [plan]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    outputs:
      staging: ${{ steps.v.outputs.staging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        run: echo "staging=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build backend binary
    needs: [plan, version, ci-ok]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        working-directory: backend
        env:
          VERSION: ${{ github.ref_name }}
          IS_PROD: ${{ startsWith(github.ref, 'refs/tags/') }}
          STAGING_VERSION: ${{ needs.version.outputs.staging }}
        run: |
          if [[ "${IS_PROD}" == "true" ]]; then
            V="${VERSION#v}"
          else
            V="${STAGING_VERSION}"
          fi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w \
              -X main.version=${V} \
              -X main.minAppVersion=${{ env.MIN_APP_VERSION }} \
              -X main.latestAppVersion=${V}" \
            -o selectdb-backend \
            ./cmd/server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-binary
          path: backend/selectdb-backend

  build-desktop-macos-arm64:
    name: Desktop (darwin/arm64)
    needs: [plan, version, ci-ok]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-wails
        with:
          path: ~/go/bin/wails*
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build analyzer binary
        run: uv run --with pyinstaller pyinstaller --onefile --collect-all sqlglot --name analyzer main.py
        working-directory: dialect/core/tokenanalyzer/python

      - name: Build
        working-directory: app
        env:
          VERSION: ${{ github.ref_name }}
          IS_PROD: ${{ startsWith(github.ref, 'refs/tags/') }}
          STAGING_VERSION: ${{ needs.version.outputs.staging }}
        run: |
          if [[ "${IS_PROD}" == "true" ]]; then
            V="${VERSION#v}"
            APP_ENV="production"
          else
            V="${STAGING_VERSION}"
            APP_ENV="staging"
          fi
          source ../.github/scripts/resolve-pubkeys.sh ../minisign.pub

          # Staging verifies updates via SHA256 checksum, not minisign.
          if [[ "${IS_PROD}" != "true" ]]; then PUBKEY=""; fi

          wails3 task package \
            APP_VERSION="${V}" \
            APP_ENV="${APP_ENV}" \
            MINISIGN_PUBLIC_KEY="${PUBKEY}"
          cp ../dialect/core/tokenanalyzer/python/dist/analyzer build/bin/select.app/Contents/MacOS/analyzer
          cd build/bin
          zip -r selectDb-darwin-arm64.zip *.app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-darwin-arm64
          path: app/build/bin/selectDb-darwin-arm64.zip

  build-desktop-macos-amd64:
    name: Desktop (darwin/amd64)
    needs: [plan, version, ci-ok]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-wails
        with:
          path: ~/go/bin/wails*
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build analyzer binary
        run: uv run --with pyinstaller pyinstaller --onefile --collect-all sqlglot --name analyzer main.py
        working-directory: dialect/core/tokenanalyzer/python

      - name: Build
        working-directory: app
        env:
          # macos-latest runners are arm64; cross-compile the Intel build.
          GOARCH: amd64
          VERSION: ${{ github.ref_name }}
          IS_PROD: ${{ startsWith(github.ref, 'refs/tags/') }}
          STAGING_VERSION: ${{ needs.version.outputs.staging }}
        run: |
          if [[ "${IS_PROD}" == "true" ]]; then
            V="${VERSION#v}"
            APP_ENV="production"
          else
            V="${STAGING_VERSION}"
            APP_ENV="staging"
          fi
          source ../.github/scripts/resolve-pubkeys.sh ../minisign.pub

          # Staging verifies updates via SHA256 checksum, not minisign.
          if [[ "${IS_PROD}" != "true" ]]; then PUBKEY=""; fi

          wails3 task package \
            APP_VERSION="${V}" \
            APP_ENV="${APP_ENV}" \
            MINISIGN_PUBLIC_KEY="${PUBKEY}"
          cp ../dialect/core/tokenanalyzer/python/dist/analyzer build/bin/select.app/Contents/MacOS/analyzer
          cd build/bin
          zip -r selectDb-darwin-amd64.zip *.app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-darwin-amd64
          path: app/build/bin/selectDb-darwin-amd64.zip

  build-desktop-windows:
    name: Desktop (windows/amd64)
    needs: [plan, version, ci-ok]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-wails
        with:
          path: ~/go/bin/wails*
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build analyzer binary
        shell: bash
        run: uv run --with pyinstaller pyinstaller --onefile --collect-all sqlglot --name analyzer main.py
        working-directory: dialect/core/tokenanalyzer/python

      - name: Build
        working-directory: app
        shell: bash
        env:
          CC: gcc
          VERSION: ${{ github.ref_name }}
          IS_PROD: ${{ startsWith(github.ref, 'refs/tags/') }}
          STAGING_VERSION: ${{ needs.version.outputs.staging }}
        run: |
          if [[ "${IS_PROD}" == "true" ]]; then
            V="${VERSION#v}"
            APP_ENV="production"
          else
            V="${STAGING_VERSION}"
            APP_ENV="staging"
          fi
          source ../.github/scripts/resolve-pubkeys.sh ../minisign.pub

          # Staging verifies updates via SHA256 checksum, not minisign.
          if [[ "${IS_PROD}" != "true" ]]; then PUBKEY=""; fi

          cp build/appicon-default.png build/appicon.png
          wails3 task package \
            APP_VERSION="${V}" \
            APP_ENV="${APP_ENV}" \
            MINISIGN_PUBLIC_KEY="${PUBKEY}"
          cp ../dialect/core/tokenanalyzer/python/dist/analyzer.exe build/bin/analyzer.exe

      - name: Package
        working-directory: app/build/bin
        shell: pwsh
        run: Compress-Archive -Path select.exe, analyzer.exe -DestinationPath selectDb-windows-amd64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-amd64
          path: app/build/bin/selectDb-windows-amd64.zip

  build-desktop-linux:
    name: Desktop (linux/amd64)
    needs: [plan, version, ci-ok]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            nsis

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-wails
        with:
          path: ~/go/bin/wails*
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        # The CLI links the webview through cgo like the app does, so on Linux
        # it needs the same gtk3 tag; without it the build reaches for the
        # GTK4/WebKitGTK 6 headers we do not install.
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build analyzer binary
        run: uv run --with pyinstaller pyinstaller --onefile --collect-all sqlglot --name analyzer main.py
        working-directory: dialect/core/tokenanalyzer/python

      - name: Build
        working-directory: app
        env:
          VERSION: ${{ github.ref_name }}
          IS_PROD: ${{ startsWith(github.ref, 'refs/tags/') }}
          STAGING_VERSION: ${{ needs.version.outputs.staging }}
        run: |
          if [[ "${IS_PROD}" == "true" ]]; then
            V="${VERSION#v}"
            APP_ENV="production"
          else
            V="${STAGING_VERSION}"
            APP_ENV="staging"
          fi
          source ../.github/scripts/resolve-pubkeys.sh ../minisign.pub

          # Staging verifies updates via SHA256 checksum, not minisign.
          if [[ "${IS_PROD}" != "true" ]]; then PUBKEY=""; fi

          cp build/appicon-default.png build/appicon.png
          wails3 task package \
            APP_VERSION="${V}" \
            APP_ENV="${APP_ENV}" \
            MINISIGN_PUBLIC_KEY="${PUBKEY}"
          cp ../dialect/core/tokenanalyzer/python/dist/analyzer build/bin/analyzer
          cd build/bin
          zip selectDb-linux-amd64.zip select analyzer

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-amd64
          path: app/build/bin/selectDb-linux-amd64.zip

  staging-release:
    name: Create staging release
    needs:
      - plan
      - build-backend
      - build-desktop-macos-arm64
      - build-desktop-macos-amd64
      - build-desktop-windows
      - build-desktop-linux
    if: needs.plan.outputs.staging-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: find . -maxdepth 1 -type f ! -name checksums.sha256 -exec sha256sum {} + > checksums.sha256

      - name: Update staging pre-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: staging-latest
          name: "Staging (latest)"
          prerelease: true
          files: dist/*
          body: "Latest build from the dev branch. Connects to staging API. Devtools enabled."

  draft-release:
    name: Create prod release
    needs:
      - plan
      - build-backend
      - build-desktop-macos-arm64
      - build-desktop-macos-amd64
      - build-desktop-windows
      - build-desktop-linux
    if: needs.plan.outputs.draft-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: find . -maxdepth 1 -type f ! -name checksums.sha256 -exec sha256sum {} + > checksums.sha256 && cat checksums.sha256

      # Draft: signatures and the publish step happen on a maintainer's laptop
      # via the select-ops repo's sign-and-deploy.sh. Users never see this release until then.
      - name: Upload to draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
