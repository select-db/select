name: CI

# Single source of truth for CI. The `plan` job holds ALL gating logic
# (change detection + module dependency fan-in + event/ref rules) and emits
# plain outputs; every other job is a simple `if: needs.plan.outputs.X`.
#
# Module dependency graph (drives the fan-in in `plan`):
#   toolkit  -> (depended on by dialect, backend, app)
#   dialect  -> (depended on by backend, app)
#   backend  -> (hosted server; nothing depends on it)
#   app      -> desktop client
#
# Branch protection should require the single "CI OK" check (not the individual
# matrix legs), since path-gated jobs may legitimately be skipped.

on:
  push:
    branches: [dev, main]
    tags: ['v[0-9]*']
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly full scan (Monday 06:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR; never cancel dev/main/tag builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WAILS_VERSION: v2.10.1
  # Minimum app version, bump when a release contains a breaking change.
  MIN_APP_VERSION: 0.0.0

jobs:
  plan:
    name: Plan CI
    runs-on: ubuntu-latest
    outputs:
      go-app:          ${{ steps.plan.outputs.go-app }}
      go-backend:      ${{ steps.plan.outputs.go-backend }}
      go-dialect:      ${{ steps.plan.outputs.go-dialect }}
      frontend:        ${{ steps.plan.outputs.frontend }}
      python:          ${{ steps.plan.outputs.python }}
      go-modules:      ${{ steps.plan.outputs.go-modules }}
      desktop:         ${{ steps.plan.outputs.desktop }}
      staging-release: ${{ steps.plan.outputs.staging-release }}
      draft-release:   ${{ steps.plan.outputs.draft-release }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
      - id: plan
        run: |
          EVENT="${{ github.event_name }}"
          REF="${{ github.ref }}"

          # Raw per-area change flags. Full on push/dispatch/schedule; on PRs we
          # diff the merge against its base (HEAD~1 of the merge commit).
          frontend=false; app=false; backend=false; dialect=false; toolkit=false; python=false
          if [[ "$EVENT" == "push" || "$EVENT" == "workflow_dispatch" || "$EVENT" == "schedule" ]]; then
            frontend=true; app=true; backend=true; dialect=true; toolkit=true; python=true
          else
            FILES="$(git diff --name-only HEAD~1 HEAD || true)"
            if grep -qE '^(\.github/|\.gitleaks\.toml)' <<<"$FILES"; then
              # Shared infra changed -> run everything to be safe.
              frontend=true; app=true; backend=true; dialect=true; toolkit=true; python=true
            else
              grep -q '^app/frontend/' <<<"$FILES" && frontend=true || true
              grep -qE '^app/(backend|main\.go|go\.(mod|sum)|\.golangci)' <<<"$FILES" && app=true || true
              grep -q '^backend/' <<<"$FILES" && backend=true || true
              { grep '^dialect/' <<<"$FILES" | grep -qv '^dialect/core/tokenanalyzer/python/'; } && dialect=true || true
              grep -q '^dialect/core/tokenanalyzer/python/' <<<"$FILES" && python=true || true
              grep -q '^toolkit/' <<<"$FILES" && toolkit=true || true
            fi
          fi

          # Dependency fan-in: everyone depends on toolkit; backend & app depend on dialect.
          go_dialect=false; [[ "$dialect" == true || "$toolkit" == true ]] && go_dialect=true || true
          go_backend=false; [[ "$backend" == true || "$dialect" == true || "$toolkit" == true ]] && go_backend=true || true
          go_app=false;     [[ "$app" == true || "$dialect" == true || "$toolkit" == true ]] && go_app=true || true
          go_toolkit="$toolkit"

          # JSON array of Go modules that need security scanning (govulncheck + gosec).
          mods=()
          [[ "$go_app" == true ]] && mods+=('"app"') || true
          [[ "$go_backend" == true ]] && mods+=('"backend"') || true
          [[ "$go_dialect" == true ]] && mods+=('"dialect"') || true
          [[ "$go_toolkit" == true ]] && mods+=('"toolkit"') || true
          joined="$(IFS=,; echo "${mods[*]}")"

          # Build/release gates (kept out of every job's conditional).
          desktop=false
          if [[ "$EVENT" == "workflow_dispatch" ]] || { [[ "$EVENT" == "push" ]] && { [[ "$REF" == "refs/heads/dev" ]] || [[ "$REF" == refs/tags/* ]]; }; }; then
            desktop=true
          fi
          staging=false; [[ "$EVENT" == "push" && "$REF" == "refs/heads/dev" ]] && staging=true || true
          draft=false;   [[ "$EVENT" == "push" && "$REF" == refs/tags/* ]] && draft=true || true

          {
            echo "go-app=$go_app"
            echo "go-backend=$go_backend"
            echo "go-dialect=$go_dialect"
            echo "frontend=$frontend"
            echo "python=$python"
            echo "go-modules=[${joined}]"
            echo "desktop=$desktop"
            echo "staging-release=$staging"
            echo "draft-release=$draft"
          } >> "$GITHUB_OUTPUT"

          echo "Plan: go-modules=[${joined}] frontend=$frontend python=$python desktop=$desktop staging=$staging draft=$draft"

  # ---- Security / vulnerability scanning (path-gated matrix) ----
  security:
    name: Security (${{ matrix.module }})
    needs: [plan]
    if: needs.plan.outputs.go-modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.go-modules) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # The app module embeds the frontend build output; stub it so packages compile.
      - run: mkdir -p app/frontend/build && touch app/frontend/build/.keep
      - run: sudo apt-get update && sudo apt-get install -y gcc
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.module }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          # Excluded rules are categorical false positives for this codebase or
          # are owned by another linter; the security-meaningful rules (taint
          # path-traversal G703, taint SSRF G704, SSH host key G106,
          # decompression-bomb G110, goroutine context G118, weak crypto, etc.)
          # stay active. Reasons:
          #   G101 identifier name-matches "password"/"token" (no real secrets; audited)
          #   G104 unhandled errors -> owned by errcheck (golangci-lint)
          #   G115 int->rune conversions in generated parser/lexer and bounded counters
          #   G201,G202 parameterized SQL built in the dialect engine (values are bound)
          #   G204 DB-dump/git/analyzer subprocess with no shell and validated args
          #   G301,G302,G306 permissions on the desktop app's own user-owned files
          #   G304 file access contained by the workspace root / validated paths
          #   G706 low-risk log injection into operator-facing logs
          gosec -exclude=G101,G104,G115,G201,G202,G204,G301,G302,G304,G306,G706 ./...

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan working tree for secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose

  # ---- Quality (lint / typecheck) ----
  quality-frontend:
    name: Frontend typecheck & lint
    needs: [plan]
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
        working-directory: app/frontend
      - run: npm run check
        working-directory: app/frontend
      - run: npm run lint
        working-directory: app/frontend

  quality-app-backend:
    name: App backend quality
    needs: [plan]
    if: needs.plan.outputs.go-app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: mkdir -p app/frontend/build && touch app/frontend/build/.keep
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: app
      - name: Dead code check
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          # deadcode exits 0 even when it finds dead code; treat any output as failure
          out=$(deadcode ./...)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::Dead code detected"
            exit 1
          fi
          echo "No dead code found"
        working-directory: app

  quality-backend:
    name: Backend quality
    needs: [plan]
    if: needs.plan.outputs.go-backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: backend
      - name: Dead code check
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          # deadcode exits 0 even when it finds dead code; treat any output as failure
          out=$(deadcode ./...)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::Dead code detected"
            exit 1
          fi
          echo "No dead code found"
        working-directory: backend

  quality-dialect:
    name: Dialect quality
    needs: [plan]
    if: needs.plan.outputs.go-dialect == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dialect/go.mod
          cache-dependency-path: dialect/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: dialect

  # ---- Tests ----
  test-app-backend:
    name: App backend tests
    needs: [plan, quality-app-backend]
    if: needs.plan.outputs.go-app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: sudo apt-get update && sudo apt-get install -y gcc
      - run: go test ./internal/...
        working-directory: app

  test-backend:
    name: Backend tests
    needs: [plan, quality-backend]
    if: needs.plan.outputs.go-backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: embedded-postgres-${{ runner.os }}-
      - run: go test ./...
        working-directory: backend

  test-dialect:
    name: Dialect tests
    needs: [plan, quality-dialect]
    if: needs.plan.outputs.go-dialect == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dialect/go.mod
          cache-dependency-path: dialect/go.sum
      - run: go test ./...
        working-directory: dialect

  test-analyzer:
    name: Analyzer tests
    needs: [plan]
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync
        working-directory: dialect/core/tokenanalyzer/python
      - run: uv run --with pytest pytest analysis/ completion/ lint_rules/ -v
        working-directory: dialect/core/tokenanalyzer/python

  # ---- Single required gate: aggregates every PR-relevant job ----
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - plan
      - security
      - gitleaks
      - quality-frontend
      - quality-app-backend
      - quality-backend
      - quality-dialect
      - test-app-backend
      - test-backend
      - test-dialect
      - test-analyzer
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::A required job did not pass ($r)"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."

  # ---- Build & release (dev/tags only; gated by plan) ----
  # Staging version: derived from commit count, not GITHUB_RUN_NUMBER, which
  # resets when the workflow file is renamed and would break the update toast.
  version:
    name: Compute staging version
    needs: [plan]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    outputs:
      staging: ${{ steps.v.outputs.staging }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: v
        run: echo "staging=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build backend binary
    needs: [plan, version, ci-ok]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        working-directory: backend
        env:
          VERSION: ${{ github.ref_name }}
          IS_PROD: ${{ startsWith(github.ref, 'refs/tags/') }}
          STAGING_VERSION: ${{ needs.version.outputs.staging }}
        run: |
          if [[ "${IS_PROD}" == "true" ]]; then
            V="${VERSION#v}"
          else
            V="${STAGING_VERSION}"
          fi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w \
              -X main.version=${V} \
              -X main.minAppVersion=${{ env.MIN_APP_VERSION }} \
              -X main.latestAppVersion=${V}" \
            -o selectdb-backend \
            ./cmd/server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-binary
          path: backend/selectdb-backend

  build-desktop-macos-arm64:
    name: Desktop (darwin/arm64)
    needs: [plan, version, ci-ok]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-wails
        with:
          path: ~/go/bin/wails*
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Build analyzer binary
        run: uv run --with pyinstaller pyinstaller --onefile --collect-all sqlglot --name analyzer main.py
        working-directory: dialect/core/tokenanalyzer/python

      - name: Build
        working-directory: app
        env:
          VERSION: ${{ github.ref_name }}
          IS_PROD: ${{ startsWith(github.ref, 'refs/tags/') }}
          STAGING_VERSION: ${{ needs.version.outputs.staging }}
        run: |
          if [[ "${IS_PROD}" == "true" ]]; then
            V="${VERSION#v}"
            APP_ENV="production" DEVTOOLS=""
          else
            V="${STAGING_VERSION}"
            APP_ENV="staging" DEVTOOLS="-devtools"
          fi
          source ../.github/scripts/resolve-pubkeys.sh ../minisign.pub

          # Staging verifies updates via SHA256 checksum, not minisign.
          if [[ "${IS_PROD}" != "true" ]]; then PUBKEY=""; fi

          export PUBLIC_APP_ENV="${APP_ENV}"
          wails build ${DEVTOOLS} \
            -platform darwin/arm64 \
            -ldflags "-X main.appVersion=${V} -X main.appEnv=${APP_ENV} -X selectDb/internal/updater.minisignPublicKey=${PUBKEY}"
          cp ../dialect/core/tokenanalyzer/python/dist/analyzer build/bin/select.app/Contents/MacOS/analyzer
          cd build/bin
          zip -r selectDb-darwin-arm64.zip *.app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-darwin-arm64
          path: app/build/bin/selectDb-darwin-arm64.zip

  build-desktop-macos-amd64:
    name: Desktop (darwin/amd64)
    needs: [plan, version, ci-ok]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-wails
        with:
          path: ~/go/bin/wails*
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Build analyzer binary
        run: uv run --with pyinstaller pyinstaller --onefile --collect-all sqlglot --name analyzer main.py
        working-directory: dialect/core/tokenanalyzer/python

      - name: Build
        working-directory: app
        env:
          VERSION: ${{ github.ref_name }}
          IS_PROD: ${{ startsWith(github.ref, 'refs/tags/') }}
          STAGING_VERSION: ${{ needs.version.outputs.staging }}
        run: |
          if [[ "${IS_PROD}" == "true" ]]; then
            V="${VERSION#v}"
            APP_ENV="production" DEVTOOLS=""
          else
            V="${STAGING_VERSION}"
            APP_ENV="staging" DEVTOOLS="-devtools"
          fi
          source ../.github/scripts/resolve-pubkeys.sh ../minisign.pub

          # Staging verifies updates via SHA256 checksum, not minisign.
          if [[ "${IS_PROD}" != "true" ]]; then PUBKEY=""; fi

          export PUBLIC_APP_ENV="${APP_ENV}"
          wails build ${DEVTOOLS} \
            -platform darwin/amd64 \
            -ldflags "-X main.appVersion=${V} -X main.appEnv=${APP_ENV} -X selectDb/internal/updater.minisignPublicKey=${PUBKEY}"
          cp ../dialect/core/tokenanalyzer/python/dist/analyzer build/bin/select.app/Contents/MacOS/analyzer
          cd build/bin
          zip -r selectDb-darwin-amd64.zip *.app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-darwin-amd64
          path: app/build/bin/selectDb-darwin-amd64.zip

  build-desktop-windows:
    name: Desktop (windows/amd64)
    needs: [plan, version, ci-ok]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-wails
        with:
          path: ~/go/bin/wails*
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Build analyzer binary
        shell: bash
        run: uv run --with pyinstaller pyinstaller --onefile --collect-all sqlglot --name analyzer main.py
        working-directory: dialect/core/tokenanalyzer/python

      - name: Build
        working-directory: app
        shell: bash
        env:
          CC: gcc
          VERSION: ${{ github.ref_name }}
          IS_PROD: ${{ startsWith(github.ref, 'refs/tags/') }}
          STAGING_VERSION: ${{ needs.version.outputs.staging }}
        run: |
          if [[ "${IS_PROD}" == "true" ]]; then
            V="${VERSION#v}"
            APP_ENV="production" DEVTOOLS=""
          else
            V="${STAGING_VERSION}"
            APP_ENV="staging" DEVTOOLS="-devtools"
          fi
          source ../.github/scripts/resolve-pubkeys.sh ../minisign.pub

          # Staging verifies updates via SHA256 checksum, not minisign.
          if [[ "${IS_PROD}" != "true" ]]; then PUBKEY=""; fi

          cp build/appicon-default.png build/appicon.png
          export PUBLIC_APP_ENV="${APP_ENV}"
          wails build ${DEVTOOLS} \
            -platform windows/amd64 \
            -ldflags "-X main.appVersion=${V} -X main.appEnv=${APP_ENV} -X selectDb/internal/updater.minisignPublicKey=${PUBKEY}"
          cp ../dialect/core/tokenanalyzer/python/dist/analyzer.exe build/bin/analyzer.exe

      - name: Package
        working-directory: app/build/bin
        shell: pwsh
        run: Compress-Archive -Path select.exe, analyzer.exe -DestinationPath selectDb-windows-amd64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-amd64
          path: app/build/bin/selectDb-windows-amd64.zip

  build-desktop-linux:
    name: Desktop (linux/amd64)
    needs: [plan, version, ci-ok]
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            nsis

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-wails
        with:
          path: ~/go/bin/wails*
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Build analyzer binary
        run: uv run --with pyinstaller pyinstaller --onefile --collect-all sqlglot --name analyzer main.py
        working-directory: dialect/core/tokenanalyzer/python

      - name: Build
        working-directory: app
        env:
          VERSION: ${{ github.ref_name }}
          IS_PROD: ${{ startsWith(github.ref, 'refs/tags/') }}
          STAGING_VERSION: ${{ needs.version.outputs.staging }}
        run: |
          if [[ "${IS_PROD}" == "true" ]]; then
            V="${VERSION#v}"
            APP_ENV="production" DEVTOOLS=""
          else
            V="${STAGING_VERSION}"
            APP_ENV="staging" DEVTOOLS="-devtools"
          fi
          source ../.github/scripts/resolve-pubkeys.sh ../minisign.pub

          # Staging verifies updates via SHA256 checksum, not minisign.
          if [[ "${IS_PROD}" != "true" ]]; then PUBKEY=""; fi

          cp build/appicon-default.png build/appicon.png
          export PUBLIC_APP_ENV="${APP_ENV}"
          wails build ${DEVTOOLS} \
            -platform linux/amd64 \
            -tags webkit2_41 \
            -ldflags "-X main.appVersion=${V} -X main.appEnv=${APP_ENV} -X selectDb/internal/updater.minisignPublicKey=${PUBKEY}"
          cp ../dialect/core/tokenanalyzer/python/dist/analyzer build/bin/analyzer
          cd build/bin
          zip selectDb-linux-amd64.zip select analyzer

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-amd64
          path: app/build/bin/selectDb-linux-amd64.zip

  staging-release:
    name: Create staging release
    needs:
      - plan
      - build-backend
      - build-desktop-macos-arm64
      - build-desktop-macos-amd64
      - build-desktop-windows
      - build-desktop-linux
    if: needs.plan.outputs.staging-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: find . -maxdepth 1 -type f ! -name checksums.sha256 -exec sha256sum {} + > checksums.sha256

      - name: Update staging pre-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: staging-latest
          name: "Staging (latest)"
          prerelease: true
          files: dist/*
          body: "Latest build from the dev branch. Connects to staging API. Devtools enabled."

  draft-release:
    name: Create prod release
    needs:
      - plan
      - build-backend
      - build-desktop-macos-arm64
      - build-desktop-macos-amd64
      - build-desktop-windows
      - build-desktop-linux
    if: needs.plan.outputs.draft-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: find . -maxdepth 1 -type f ! -name checksums.sha256 -exec sha256sum {} + > checksums.sha256 && cat checksums.sha256

      # Draft: signatures and the publish step happen on a maintainer's laptop
      # via the select-ops repo's sign-and-deploy.sh. Users never see this release until then.
      - name: Upload to draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
