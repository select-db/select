name: Backend

# The hosted server module. Called by ci.yml, which owns the gating.
#
# Quality and tests are independent, for the reason given in ci-app.yml.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: backend/go.mod
          # Module cache from setup-go, build cache below. See the App
          # workflow's backend quality job.
          cache-dependency-path: backend/go.sum
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-backend-plain-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-backend-plain-${{ hashFiles('backend/go.sum') }}-
            go-backend-plain-
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: backend
          # Skips the JSONSchema fetch from golangci-lint.run, which runs
          # before any linting. An outage there failed a build on #174.
          verify: false
      - uses: ./.github/actions/deadcode
        with:
          go-version: ${{ steps.setup-go.outputs.go-version }}
      - name: Dead code check
        run: |
          # -test because the e2e harness is reachable only from _test.go, so
          # tests must be roots or the support package reads as dead. deadcode
          # exits 0 on a finding, so output is the failure.
          out=$(deadcode -test ./...)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::Dead code detected"
            exit 1
          fi
          echo "No dead code found"
        working-directory: backend

      # db/generated is committed and drifted from the schema once, because
      # regenerating needed a live database nobody had in CI. sqlc reads
      # db/migrations, so this job regenerates and diffs without one.
      #
      # Through the script rather than sqlc directly, because the script also
      # checks for nullable columns that fell back to database/sql types.
      #
      # TERM is load bearing. The script calls tput, which fails under set -e
      # when TERM is unset, as it is on the runner.
      - uses: ./.github/actions/sqlc
      - name: Generated sqlc output is up to date
        working-directory: backend
        env:
          TERM: xterm
        run: |
          ./scripts/generate_queries.sh
          git diff --exit-code db/generated || {
            echo "::error::db/generated is stale. Run backend/scripts/generate_queries.sh and commit the result."
            exit 1
          }

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # Module cache from setup-go, build cache below. See the App
          # workflow's backend quality job.
          cache-dependency-path: backend/go.sum
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-backend-plain-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-backend-plain-${{ hashFiles('backend/go.sum') }}-
            go-backend-plain-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: embedded-postgres-${{ runner.os }}-
      # The audit tests need pg_partman so they exercise the production config
      # of real monthly partitions, not the DEFAULT partition fallback. The
      # harness reads TEST_PG_*, and packages without those use embedded
      # Postgres. The port is derived because the runner's own cluster holds
      # 5432.
      - name: Postgres 18 + pg_partman
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-18-partman
          sudo pg_createcluster --start 18 main || sudo pg_ctlcluster 18 main start || true
          PORT=$(pg_lsclusters -h | awk '$1==18 {print $3}')
          sudo -u postgres psql -p "$PORT" -c "ALTER USER postgres PASSWORD 'postgres';"
          {
            echo "TEST_PG_HOST=localhost"
            echo "TEST_PG_PORT=$PORT"
            echo "TEST_PG_USER=postgres"
            echo "TEST_PG_PASSWORD=postgres"
          } >> "$GITHUB_ENV"
      - run: go test ./...
        working-directory: backend
      # Written here because tests compile the widest set of packages, and only
      # on the default branch. A cache saved from a PR is readable by that PR
      # alone, so it would fill the 10GB budget and evict the shared entries.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/dev'
        with:
          path: ~/.cache/go-build
          key: go-backend-plain-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
