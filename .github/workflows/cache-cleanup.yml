name: Cache cleanup

# Caches are scoped to the ref that created them, so a closed PR's caches can
# never be read again. They still count against the repository's 10GB budget,
# where GitHub evicts by least recent use and so drops live entries to keep
# dead ones. 31 of these held 4.35GB of 9.7GB when this was added.

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    name: Drop the closed PR's caches
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches for this ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/actions/caches?ref=$REF&per_page=100" --jq '.actions_caches[].id')
          [ -z "$ids" ] && { echo "No caches for $REF"; exit 0; }
          for id in $ids; do
            gh api --method DELETE "repos/$REPO/actions/caches/$id" --silent && echo "deleted $id"
          done
