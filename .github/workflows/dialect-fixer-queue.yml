name: Dialect fixer queue

# Works the agent:finder issues the way dependabot works dependencies;
# .claude/skills/dialect-fixer/scripts/queue.sh decides. The review request on a
# green pull request is the only notification. fix:skip keeps an issue out.

on:
  push:
    branches: [dev]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['claude/fix-*']
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # One plan at a time, so two cannot start the same issue; the runs it
    # dispatches are their own workflow runs and do not hold this.
    concurrency:
      group: dialect-fixer-queue
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FIXER_REVIEWER: Arthur-Mesplede
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .claude/skills/dialect-fixer/scripts
      - run: |
          runs=$(.claude/skills/dialect-fixer/scripts/queue.sh)
          echo "Started: $runs" >> "$GITHUB_STEP_SUMMARY"
