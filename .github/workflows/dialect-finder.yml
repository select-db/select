name: Dialect finder

# Wakes the dialect-finder skill: it probes grid positions not tried yet and
# files issues for what it finds. It never changes code. Its memory is the
# agent/finder-memory branch; .claude/skills/dialect-finder has the rest.
#
# Repository settings it reads: secret CLAUDE_CODE_OAUTH_TOKEN (made with
# `claude setup-token`, so runs bill a Claude subscription rather than an API
# key), and optionally the variable FINDER_MODEL.

on:
  # GitHub can drop a scheduled run without a trace, so a second slot
  # retries; the Due job skips it when the first one started.
  schedule:
    - cron: "17 2 * * *"
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes the agent spends finding; it gets 10 more to file and save
        type: number
        default: 20
      dry_run:
        description: File no issues and push no ledger
        type: boolean
        default: false
      positions:
        description: Grid positions to try, at most; the minutes usually run out first
        type: number
        default: 100

permissions:
  contents: write
  issues: write

# One writer to the ledger at a time. A queued run waits rather than cancels
# a run halfway through its batches.
concurrency:
  group: dialect-finder
  cancel-in-progress: false

jobs:
  due:
    name: Due
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            since=$(date -u -d '-20 hours' +%Y-%m-%dT%H:%M:%SZ)
            earlier=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dialect-finder.yml --event schedule \
              --created ">=$since" --json databaseId --jq "map(select(.databaseId != $GITHUB_RUN_ID)) | length")
            [ "$earlier" = 0 ] || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  find:
    name: Find
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A ceiling only: the Find step's own timeout is what the minutes input sets.
    timeout-minutes: 240
    env:
      FINDER_MEMORY: .finder-memory
      # Assigned and mentioned on what the finder files.
      FINDER_NOTIFY: Arthur-Mesplede
      FINDER_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      # A scheduled run has no inputs, so these defaults are the nightly run's.
      FINDER_TARGET_POSITIONS: ${{ inputs.positions || 100 }}
      FINDER_MINUTES: ${{ inputs.minutes || 20 }}
      FINDER_BATCH: "20"
      FINDER_MAX_ISSUES: "5"
      FINDER_QUIET_RUNS: "5"
      FINDER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      SCRIPTS: .claude/skills/dialect-finder/scripts
      # Anthropic token out of subprocesses, and a PID namespace for their /proc.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dialect-agent-env
        with:
          sandbox: true

      - name: Check out the ledger
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin agent/finder-memory >/dev/null; then
            git fetch --depth=1 origin agent/finder-memory
            git worktree add -B agent/finder-memory "$FINDER_MEMORY" FETCH_HEAD
          else
            git worktree add --orphan -b agent/finder-memory "$FINDER_MEMORY"
          fi
          mkdir -p .finder-work
          # What the Go case tables already pin, exported fresh each run so a
          # case a merged fix added counts from the next run on.
          dialect/agentprobe -export-cases > .finder-work/known.jsonl

      - name: Labels
        if: env.FINDER_DRY_RUN != '1'
        run: $SCRIPTS/labels.sh

      - name: Sync with filed issues
        run: |
          python3 $SCRIPTS/sync.py
          $SCRIPTS/checkpoint.sh "sync with issues"

      # Commands run in Claude Code's sandbox (.github/agent-sandbox.json), with
      # no token and no network; file.sh and checkpoint.sh reach GitHub from outside it.
      - name: Deadline
        id: tools
        run: |
          echo "FINDER_DEADLINE=$(( $(date +%s) + FINDER_MINUTES * 60 ))" >> "$GITHUB_ENV"
          # The agent stops starting batches at the deadline; the hard timeout
          # leaves it 10 minutes past that to file, summarise and checkpoint.
          echo "hard_timeout=$(( FINDER_MINUTES + 10 ))" >> "$GITHUB_OUTPUT"

      - name: Find
        id: find
        timeout-minutes: ${{ fromJSON(steps.tools.outputs.hard_timeout) }}
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          settings: .github/agent-sandbox.json
          # Any value keeps the token out of .git/config, behind a git credential
          # helper; a scheduled run has no actor for it to admit.
          allowed_non_write_users: ${{ env.FINDER_NOTIFY }}
          prompt: |
            This is a dialect finder run in ${{ github.repository }}.
            Follow .claude/skills/dialect-finder/SKILL.md from step 1 to step 6.
            The environment variables it names are set, with these values, so there
            is no need to read the environment:
            FINDER_MEMORY=${{ env.FINDER_MEMORY }} FINDER_NOTIFY=${{ env.FINDER_NOTIFY }}
            FINDER_DRY_RUN=${{ env.FINDER_DRY_RUN }} FINDER_TARGET_POSITIONS=${{ env.FINDER_TARGET_POSITIONS }}
            FINDER_BATCH=${{ env.FINDER_BATCH }} FINDER_MAX_ISSUES=${{ env.FINDER_MAX_ISSUES }}
            FINDER_QUIET_RUNS=${{ env.FINDER_QUIET_RUNS }} FINDER_DEADLINE=${{ env.FINDER_DEADLINE }}
            FINDER_RUN_URL=${{ env.FINDER_RUN_URL }}
          claude_args: >-
            --model ${{ vars.FINDER_MODEL || 'opus' }}
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Agent,Task,Bash,Edit(/.finder-memory/**),Edit(/.finder-work/**)"
            --disallowedTools "Read(//proc/*/environ),Read(//proc/*/cmdline),Read(~/.ssh/**)"

      - name: Refused tool calls
        if: always() && steps.find.outputs.execution_file != ''
        uses: ./.github/actions/refused-calls
        with:
          execution-file: ${{ steps.find.outputs.execution_file }}

      # Whatever the agent appended after its last checkpoint, a timeout included.
      - name: Save the ledger
        if: always() && hashFiles('.finder-memory/**') != ''
        run: $SCRIPTS/checkpoint.sh "end of run ${{ github.run_id }}"

      - name: Report
        if: always()
        run: |
          if [ -s .finder-work/summary.md ]; then
            cat .finder-work/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The agent wrote no summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report failure
        if: failure() && env.FINDER_DRY_RUN != '1'
        run: $SCRIPTS/post.sh failed "$FINDER_RUN_URL"
