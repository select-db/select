name: Dialect finder

# Wakes the dialect-finder skill: it probes the dialect package and writes the
# issues it would file to .finder-work/file/, which the File step files. It
# never changes code. Its memory is the Go case tables and its own issues.
#
# Needs the secret CLAUDE_CODE_OAUTH_TOKEN; reads the variable FINDER_MODEL.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes the agent spends finding; it gets 10 more to wrap up
        type: number
        default: 20
      dry_run:
        description: File no issues
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: dialect-finder
  cancel-in-progress: false

jobs:
  find:
    name: Find
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # Assigned and mentioned on what the finder files.
      FINDER_NOTIFY: Arthur-Mesplede
      FINDER_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      FINDER_MINUTES: ${{ inputs.minutes || 20 }}
      FINDER_MAX_ISSUES: "5"
      FINDER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      SCRIPTS: .claude/skills/dialect-finder/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dialect-agent-env

      # What the case tables already pin, and every finder issue with the last
      # maintainer comment, which on a closed one is the verdict's reason.
      - name: Memory
        id: memory
        run: |
          mkdir -p .finder-work
          dialect/agentprobe -export-cases > .finder-work/known.jsonl
          gh issue list --label agent:finder --state all --limit 1000 \
            --json number,title,state,labels,body,comments --jq 'map({number, title, state,
              labels: [.labels[].name], body: .body[0:800],
              ruling: ([.comments[] | select(.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR"))] | last | .body // null)})' \
            > .finder-work/issues.json
          [ "$FINDER_DRY_RUN" = 1 ] || $SCRIPTS/labels.sh
          echo "FINDER_DEADLINE=$(( $(date +%s) + FINDER_MINUTES * 60 ))" >> "$GITHUB_ENV"
          echo "hard_timeout=$(( FINDER_MINUTES + 10 ))" >> "$GITHUB_OUTPUT"

      - name: Find
        id: find
        timeout-minutes: ${{ fromJSON(steps.memory.outputs.hard_timeout) }}
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          settings: .github/agent-sandbox.json
          # Any value keeps the token out of .git/config, behind a credential helper.
          allowed_non_write_users: ${{ env.FINDER_NOTIFY }}
          prompt: |
            This is a dialect finder run in ${{ github.repository }}. Follow .claude/skills/dialect-finder/SKILL.md.
            FINDER_NOTIFY=${{ env.FINDER_NOTIFY }} FINDER_DRY_RUN=${{ env.FINDER_DRY_RUN }}
            FINDER_MAX_ISSUES=${{ env.FINDER_MAX_ISSUES }} FINDER_DEADLINE=${{ env.FINDER_DEADLINE }}
            FINDER_RUN_URL=${{ env.FINDER_RUN_URL }}
          claude_args: >-
            --model ${{ vars.FINDER_MODEL || 'opus' }}
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Agent,Task,Bash,Edit(/.finder-work/**)"

      # The sandbox may not keep the agent out of .claude and .github, and the
      # step below runs a script from there with a token.
      - name: Restore trusted files
        if: always() && env.AGENT_BASE != ''
        run: |
          git restore --source="$AGENT_BASE" --worktree -- .claude .github
          git clean -fdq -- .claude .github

      - name: File
        if: always() && env.FINDER_DRY_RUN != '1' && steps.find.outcome != 'skipped'
        run: $SCRIPTS/file.sh

      - name: Report
        if: always()
        run: cat .finder-work/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "The agent wrote no summary." >> "$GITHUB_STEP_SUMMARY"
