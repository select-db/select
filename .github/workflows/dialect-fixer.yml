name: Dialect fixer

# A maintainer labels an agent:finder issue fix:go. The agent fixes it in
# Claude Code's sandbox, with no token and no network; its Stop hook
# (.claude/skills/dialect-fixer/scripts/publish.sh) pushes claude/fix-N and
# opens the draft pull request with the Claude App's token, whose pushes run CI.
#
# Needs the secret CLAUDE_CODE_OAUTH_TOKEN and the Claude GitHub App installed.

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  fix:
    name: Fix
    if: github.event.label.name == 'fix:go'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: dialect-fixer-${{ github.event.issue.number }}
    # The workflow token only reads and comments; the App token pushes.
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    env:
      FIXER_ISSUE: ${{ github.event.issue.number }}
      # Mentioned on blocked notes and failures.
      FIXER_NOTIFY: Arthur-Mesplede
      # The analyzer-backed tests fail rather than skip, as in CI.
      SELECT_REQUIRE_ANALYZER: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A stored workflow token outranks the App's, and CI then waits for approval.
          persist-credentials: false

      # Comments from people without write access are left out: they are the
      # easiest place to plant instructions.
      - name: Read the issue
        run: |
          mkdir -p .fixer-work
          {
            gh issue view "$FIXER_ISSUE" --json number,title,body --jq '"# #\(.number) \(.title)\n\n\(.body)"'
            echo; echo "## Comments from maintainers and the finder"
            gh api "repos/$GITHUB_REPOSITORY/issues/$FIXER_ISSUE/comments" --paginate --jq '.[]
              | select(.author_association == "OWNER" or .author_association == "MEMBER"
                or .author_association == "COLLABORATOR" or .user.login == "github-actions[bot]")
              | "\n### \(.user.login), \(.created_at)\n\n\(.body)"'
          } > .fixer-work/issue.md
          echo "FIXER_DEADLINE=$(( $(date +%s) + 60 * 60 ))" >> "$GITHUB_ENV"

      - uses: ./.github/actions/dialect-agent-env
        with:
          fixer: true

      - name: Fix
        id: agent
        timeout-minutes: 70
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: .github/agent-sandbox.json
          # Any value keeps the action's token out of .git/config, behind a
          # credential helper; it admits nobody else without github_token.
          allowed_non_write_users: ${{ env.FIXER_NOTIFY }}
          prompt: |
            Fix issue #${{ env.FIXER_ISSUE }} in ${{ github.repository }}.
            Follow the "Unattended runs" section of .claude/skills/dialect-fixer/SKILL.md.
            FIXER_ISSUE=${{ env.FIXER_ISSUE }} FIXER_DEADLINE=${{ env.FIXER_DEADLINE }}
            FIXER_NOTIFY=${{ env.FIXER_NOTIFY }}; these are also in the environment.
          claude_args: >-
            --model ${{ vars.FIXER_MODEL || 'opus' }}
            --max-turns 250
            --allowedTools "Read,Grep,Glob,Agent,Task,Skill,Bash,Edit(/dialect/**),Edit(/.fixer-work/**)"

      # The agent's tool calls, so a run can be checked against what it reports.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.agent.outputs.execution_file != ''
        with:
          name: fixer-transcript
          path: ${{ steps.agent.outputs.execution_file }}
          retention-days: 7

      - name: Report
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
        run: |
          gh issue edit "$FIXER_ISSUE" --remove-label fix:go
          pr=$(gh pr list --head "claude/fix-$FIXER_ISSUE" --state open --json url --jq '.[0].url // empty')
          final=$(jq -r '.. | objects | select(.type? == "result") | .result // empty' "${EXECUTION_FILE:-/dev/null}" 2>/dev/null | tail -c 1500)
          printf '### Final message\n\n%s\n' "${final:-None.}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$pr" ]; then
            echo "Pull request: $pr" >> "$GITHUB_STEP_SUMMARY"
          elif [ -s .fixer-work/blocked.md ]; then
            gh issue comment "$FIXER_ISSUE" --body-file .fixer-work/blocked.md
            gh issue edit "$FIXER_ISSUE" --add-label fix:blocked --add-assignee "$FIXER_NOTIFY"
          else
            printf '@%s the fixer run ended without a pull request or a blocked note: %s. Add fix:go again to retry.\n\nIts last words:\n\n%s\n' \
              "$FIXER_NOTIFY" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$(sed 's/^/> /' <<<"${final:-(none)}")" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$FIXER_ISSUE" --body-file "$RUNNER_TEMP/comment.md"
          fi
