name: dialect-agent-env
description: Go, the analyzer venv, a prebuilt agentprobe and Claude Code's sandbox, for the dialect agents.

inputs:
  fixer:
    description: "true to also prebuild the tests and install the linter the fixer runs"
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: dialect/go.mod
        cache-dependency-path: dialect/go.sum
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
    - shell: bash
      working-directory: dialect/core/tokenanalyzer/python
      run: uv sync
    # The sandbox has no network: every module, test build and the pinned
    # linter are fetched now, then Go and uv are told to stay offline.
    - shell: bash
      working-directory: dialect
      env:
        FIXER: ${{ inputs.fixer }}
      run: |
        go mod download
        go build -o agentprobe ./cmd/agentprobe
        if [ "$FIXER" = true ]; then
          go test -count=1 -run '^$' ./... >/dev/null || true
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
        fi
        echo "GOPROXY=off" >> "$GITHUB_ENV"
        echo "UV_OFFLINE=1" >> "$GITHUB_ENV"
    # The publish hook's scripts go where the sandbox cannot write, and the
    # commit is recorded so the steps after the agent can restore .claude and .github.
    - shell: bash
      run: |
        tools="$RUNNER_TEMP/agent-tools"
        mkdir -p "$tools"
        cp .claude/skills/dialect-fixer/scripts/{publish.sh,tool-calls.jq} .claude/hooks/pr-review-gate.sh "$tools/"
        {
          echo "AGENT_TOOLS=$tools"
          echo "AGENT_BASE=$(git rev-parse HEAD)"
          # Keeps the Anthropic token from commands, and /proc from showing it.
          echo "CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1"
        } >> "$GITHUB_ENV"
    # Ubuntu 24.04's AppArmor otherwise refuses bubblewrap its user namespace;
    # the bwrap call fails here, before an agent run is paid for.
    - shell: bash
      run: |
        apt_install() { sudo apt-get install -y -qq --no-install-recommends bubblewrap socat >/dev/null; }
        apt_install || { sudo apt-get update -qq >/dev/null && apt_install; }
        sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true
        bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc true
