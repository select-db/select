name: dialect-agent-env
description: Go, the analyzer venv, a prebuilt agentprobe and Claude Code's sandbox, for the dialect agents.

inputs:
  sandbox:
    description: fixer or finder, to set up Claude Code's sandbox for that agent.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: dialect/go.mod
        cache-dependency-path: dialect/go.sum
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
    - shell: bash
      working-directory: dialect/core/tokenanalyzer/python
      run: uv sync
    # Built once so an agent's batches do not each pay for a compile.
    - shell: bash
      working-directory: dialect
      run: go build -o agentprobe ./cmd/agentprobe
    # Claude Code's sandbox needs bubblewrap and socat, and Ubuntu 24.04's
    # AppArmor policy otherwise refuses bubblewrap the user namespace it needs.
    # The bwrap call fails here, before an agent run is paid for.
    - if: inputs.sandbox != ''
      shell: bash
      env:
        AGENT: ${{ inputs.sandbox }}
      run: |
        # Shared rules, then this agent's paths, anchored at the workspace.
        # `*` replaces arrays, so none is in both files.
        dir=.github/agent-sandbox
        jq -s --arg ws "$GITHUB_WORKSPACE" '
          def abs: if startswith("/") or startswith("~") then . else "\($ws)/\(.)" end;
          .[0] * .[1]
          | .sandbox.filesystem.denyWrite |= (. // [] | map(abs))
        ' "$dir/base.json" "$dir/$AGENT.json" > "$RUNNER_TEMP/agent-settings.json"
        # The scrub keeps the Anthropic token from commands and gives them a PID
        # namespace, so /proc does not show the parent's environment.
        echo "AGENT_SETTINGS=$RUNNER_TEMP/agent-settings.json" >> "$GITHUB_ENV"
        echo "CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1" >> "$GITHUB_ENV"
        apt_install() { sudo apt-get install -y -qq --no-install-recommends bubblewrap socat >/dev/null; }
        apt_install || { sudo apt-get update -qq >/dev/null && apt_install; }
        sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true
        bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc true
