[project]
name = "selectdb-lint"
version = "0.1.0"
description = "Python SQL analysis process for selectDb, powered by sqlglot"
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analysis*", "completion*", "lint_rules*"]

[tool.setuptools]
py-modules = ["server", "main"]

[tool.pytest.ini_options]
testpaths = ["analysis", "completion", "lint_rules"]
