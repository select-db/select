# Installed by lockdown.sh as /etc/ssh/sshd_config.d/10-netbird.conf.
#
# The network is what keeps strangers off port 22; this only removes the
# credentials that survive a network mistake. No ListenAddress here: binding
# sshd to the NetBird address makes it fail to start when the agent is late.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
