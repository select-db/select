version: "2"
sql:
  - engine: "postgresql"
    queries: "db/generated/all_queries.sql"
    schema:
      - "db/migrations"
    gen:
      go:
        out: "db/generated"
        package: "generated"
        overrides:
            - db_type: "text"
              nullable: true
              go_type: "backend/db/db_types.JSONNullString"

            - db_type: "uuid"
              nullable: true
              go_type: "backend/db/db_types.JSONNullUUID"

            - db_type: "varchar"
              nullable: true
              go_type: "backend/db/db_types.JSONNullString"

            - db_type: "pg_catalog.int8"
              nullable: true
              go_type: "backend/db/db_types.JSONNullInt64"

            - db_type: "pg_catalog.int4"
              nullable: true
              go_type: "backend/db/db_types.JSONNullInt64"

            - db_type: "pg_catalog.bool"
              nullable: true
              go_type: "backend/db/db_types.JSONNullBool"

            - db_type: "pg_catalog.timestamp"
              nullable: true
              go_type: "backend/db/db_types.JSONNullTime"

            - db_type: "pg_catalog.timestamptz"
              nullable: true
              go_type: "backend/db/db_types.JSONNullTime"

            # Reading the migrations rather than a dump, sqlc sees each type as
            # the migration wrote it (TIMESTAMPTZ), not the catalog name a dump
            # spells out. Both spellings map to the same wrapper so the generated
            # shape does not depend on which one a migration happens to use.
            - db_type: "timestamptz"
              nullable: true
              go_type: "backend/db/db_types.JSONNullTime"

            - db_type: "timestamp"
              nullable: true
              go_type: "backend/db/db_types.JSONNullTime"

            - db_type: "inet"
              nullable: true
              go_type: "backend/db/db_types.JSONNullInet"