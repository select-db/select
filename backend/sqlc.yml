version: "2"
sql:
  - engine: "postgresql"
    queries: "db/generated/all_queries.sql"
    schema:
      - "db/schema.sql"
    gen:
      go:
        out: "db/generated"
        package: "generated"
        overrides:
            - db_type: "text"
              nullable: true
              go_type: "backend/db/db_types.JSONNullString"

            - db_type: "uuid"
              nullable: true
              go_type: "backend/db/db_types.JSONNullUUID"

            - db_type: "varchar"
              nullable: true
              go_type: "backend/db/db_types.JSONNullString"

            - db_type: "pg_catalog.int8"
              nullable: true
              go_type: "backend/db/db_types.JSONNullInt64"

            - db_type: "pg_catalog.int4"
              nullable: true
              go_type: "backend/db/db_types.JSONNullInt64"

            - db_type: "pg_catalog.bool"
              nullable: true
              go_type: "backend/db/db_types.JSONNullBool"

            - db_type: "pg_catalog.timestamp"
              nullable: true
              go_type: "backend/db/db_types.JSONNullTime"

            - db_type: "pg_catalog.timestamptz"
              nullable: true
              go_type: "backend/db/db_types.JSONNullTime"

            - db_type: "inet"
              nullable: true
              go_type: "backend/db/db_types.JSONNullInet"