version: "2"
sql:
  - engine: "postgresql"
    queries: "db/generated/all_queries.sql"
    schema:
      - "db/migrations"
    gen:
      go:
        out: "db/generated"
        package: "generated"
        overrides:
            - db_type: "text"
              nullable: true
              go_type: "backend/db/db_types.JSONNullString"

            - db_type: "uuid"
              nullable: true
              go_type: "backend/db/db_types.JSONNullUUID"

            - db_type: "pg_catalog.varchar"
              nullable: true
              go_type: "backend/db/db_types.JSONNullString"

            - db_type: "pg_catalog.int8"
              nullable: true
              go_type: "backend/db/db_types.JSONNullInt64"

            - db_type: "pg_catalog.int4"
              nullable: true
              go_type: "backend/db/db_types.JSONNullInt64"

            - db_type: "pg_catalog.bool"
              nullable: true
              go_type: "backend/db/db_types.JSONNullBool"

            - db_type: "pg_catalog.timestamp"
              nullable: true
              go_type: "backend/db/db_types.JSONNullTime"

            - db_type: "pg_catalog.timestamptz"
              nullable: true
              go_type: "backend/db/db_types.JSONNullTime"

            # sqlc matches db_type literally against how the column was declared,
            # and the two ways of writing one type do not normalize to each other:
            # the SQL-standard keyword (TIMESTAMP WITH TIME ZONE) becomes
            # pg_catalog.timestamptz, the Postgres-native name (TIMESTAMPTZ) stays
            # bare. db/migrations uses both, so both need an entry. A spelling with
            # no entry falls back to database/sql's null types instead of these
            # wrappers, silently -- generate_queries.sh fails on that rather than
            # leaving it to review.
            - db_type: "timestamptz"
              nullable: true
              go_type: "backend/db/db_types.JSONNullTime"

            - db_type: "inet"
              nullable: true
              go_type: "backend/db/db_types.JSONNullInet"