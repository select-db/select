# gitleaks configuration — extends the upstream default ruleset and allowlists
# a few well-understood false positives. Keep this list tight: every entry is a
# verified non-secret, not a way to silence real findings.
title = "select gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Embedded default editor config: JSON \"key\" fields (keybindings/snippets) trip the generic-api-key heuristic but contain no secrets."
paths = ['''app/backend/graph/defaults/\.config$''']

[[allowlists]]
description = "Redaction unit test uses an obviously-fake private key fixture (\"NOTAREALKEY\")."
paths = ['''backend/internal/api/datasource/secret_redact_test\.go$''']
