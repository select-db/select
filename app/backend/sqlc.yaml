version: "2"
cloud:
  project: "01JNM11R23W532K8FPW6N5GJX4"
sql:
  - engine: "sqlite"
    queries: "db/generated/all_queries.sql"
    schema: "db/schema.sql"
    gen:
      go:
        out: "db/generated"
        package: "generated"
        emit_json_tags: true
        overrides:
          - db_type: "TEXT"
            nullable: true
            go_type: "selectDb/backend/db/db_types.JSONNullString"

          - db_type: "BOOL"
            nullable: true
            go_type: "selectDb/backend/db/db_types.JSONNullBool"