version: "2"
cloud:
  project: "01JNM11R23W532K8FPW6N5GJX4"
sql:
  - engine: "sqlite"
    queries: "db/generated/all_queries.sql"
    schema: "db/schema.sql"
    gen:
      go:
        out: "db/generated"
        package: "generated"
        emit_json_tags: true
        overrides:
          - db_type: "TEXT"
            nullable: true
            go_type: "selectDb/internal/db/db_types.JSONNullString"

          - db_type: "BOOL"
            nullable: true
            go_type: "selectDb/internal/db/db_types.JSONNullBool"

          # Keep JSON columns as `any` (via alias); the mutation flow reassigns a
          # decoded DTO into this field. Newer sqlc otherwise defaults to json.RawMessage.
          - column: "mutation_commit.payload"
            go_type: "selectDb/internal/db/db_types.JSONPayload"