# Wails v3 project configuration. Consumed by `wails3 dev` and
# `wails3 generate build-assets`.
version: '3'

info:
  companyName: 'Select'
  productName: 'Select'
  productIdentifier: 'com.select-db.app'
  description: 'Select database client'
  copyright: '(c) 2026, Select'
  comments: 'Select database client'
  # Seed value only: shipped builds get their version from APP_VERSION
  # (see Taskfile.yml), which CI sets from the release tag.
  version: '0.0.0'

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - build/bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - '*_test.go'
    watched_extension:
      - '*.go'
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
