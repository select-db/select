# selectdb.conf, SERVER_NAME_PLACEHOLDER is replaced by setup-server.sh
# certbot will append the 443 ssl block and the HTTP→HTTPS redirect automatically.
server {
    listen 80;
    server_name SERVER_NAME_PLACEHOLDER;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Backend proxy
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  90s;
        proxy_send_timeout  90s;
    }

    # Serve desktop app release artifacts
    location /releases/ {
        alias /opt/selectdb/www/releases/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}